name: drusight
description: >-
  DruSight - a digital companion for presumptive field drug testing.
  Adds calibrated measurement, quality control, explainability and a
  tamper-evident evidence record around an existing physical field-test kit.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (lightweight, no codegen).
  provider: ^6.1.2

  # Local persistence.
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Camera + device.
  camera: ^0.11.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

  # Location.
  geolocator: ^12.0.0

  # Pixel access for the CV layer. Pure Dart, no OpenCV dependency.
  image: ^4.2.0

  # Cryptography: SHA-256 + Ed25519. Standard, audited implementations.
  crypto: ^3.0.3
  cryptography: ^2.7.0

  # Private key storage backed by Android Keystore / iOS Keychain.
  flutter_secure_storage: ^9.2.2

  # Local QR generation + scanning. No network round-trip.
  qr_flutter: ^4.1.0
  mobile_scanner: 6.0.0

  intl: ^0.19.0

  # HTTP client for live news sync (UNODC RSS, NewsAPI free tier).
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/kits/
    - assets/knowledge/
    - assets/tutorials/
    - assets/models/
    - assets/demo/
